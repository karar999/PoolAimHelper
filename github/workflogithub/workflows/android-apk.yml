
name: Build PoolAimHelper APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.2.1/bin >> "$GITHUB_PATH"

      - name: Extract project
        run: unzip -q PoolAimHelper_CloudBuild_Package.zip -d .

      - name: Build APK
        working-directory: PoolAimHelper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolAimHelper-APK
          path: PoolAimHelper/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
