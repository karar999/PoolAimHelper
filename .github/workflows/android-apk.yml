
name: Build PoolAimHelper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract project
        run: unzip -q PoolAimHelper_CloudBuild_Package.zip -d buildsrc

      - name: Fix Gradle repositories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("buildsrc/PoolAimHelper/settings.gradle.kts")
          s = p.read_text()
          block = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          """
          if "pluginManagement" not in s:
              p.write_text(block + s)
          PY

      - name: Build APK
        working-directory: buildsrc/PoolAimHelper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolAimHelper-APK
          path: buildsrc/PoolAimHelper/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
